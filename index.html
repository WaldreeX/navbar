<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Principal | Mi Sitio Web</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/menu-responsive.js" defer></script>
</head>
<body>
    <!-- Header/Navbar -->
    <header class="navbar">
        <div class="navbar-container">
            <!-- Logo -->
            <div class="navbar-logo">
                <a href="#">Tienda May</a>
            </div>

            <!-- Menu de navegación (visible en desktop) -->
            <nav class="navbar-menu" id="navbarMenu">
                <ul class="navbar-list">
                    <li class="navbar-item">
                        <a href="#" class="navbar-link">Inicio</a>
                    </li>
                    <li class="navbar-item">
                        <a href="#" class="navbar-link">Servicios</a>
                    </li>
                    <li class="navbar-item">
                        <a href="#" class="navbar-link">Productos</a>
                    </li>
                    <li class="navbar-item">
                        <a href="#" class="navbar-link">Contacto</a>
                    </li>
                </ul>
            </nav>

            <!-- Botón hamburguesa (solo en móvil) -->
            <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menú">
                <span class="hamburger-line-1"></span>
                <span class="hamburger-line-2"></span>
                <span class="hamburger-line-3"></span>
            </button>
        </div>
    </header>

    <!-- Overlay/Backdrop -->
    <div class="navbar-overlay" id="navbarOverlay"></div>

    <!-- Contenido principal -->
    <main>
        <section class="hero">
            <h1>Bienvenido a Mi Sitio Web</h1>
            <p>Este es un sitio de prueba y aun está en desarrollo.</p>
        </section>
    </main>


</body>
</html>
